# Lingkungan uji coba lokal Midnight (proof server + node + indexer).
# Sesuaikan tag image dengan rilis testnet Midnight yang Anda pakai; daftar tag
# resmi ada di https://docs.midnight.network.
services:
  proof-server:
    image: midnightnetwork/proof-server:latest
    container_name: poh-proof-server
    command: ["midnight-proof-server", "--verbose"]
    ports:
      - "6300:6300"

  node:
    image: midnightnetwork/midnight-node:latest
    container_name: poh-node
    environment:
      CFG_PRESET: dev
    ports:
      - "9944:9944"

  indexer:
    image: midnightntwrk/indexer-standalone:latest
    container_name: poh-indexer
    depends_on:
      - node
    environment:
      RUST_LOG: info
      APP__INFRA__SUBSTRATE__URL: ws://node:9944
    ports:
      - "8088:8088"
